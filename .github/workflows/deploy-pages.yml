name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GitHub Pages only serves static files. The WebSocket signaling server is a
      # separate Node process (see server/ and Dockerfile) and must be deployed
      # elsewhere; point VITE_SIGNALING_URL at it.
      - name: Build
        env:
          VITE_BASE_PATH: ${{ format('/{0}/', github.event.repository.name) }}
          VITE_SIGNALING_URL: ${{ vars.VITE_SIGNALING_URL }}
        run: npm run build
      # Pages has to be enabled once per repository (Settings → Pages → Source: GitHub
      # Actions): creating the site needs an account-level permission a workflow token does not
      # carry, so `enablement: true` below is a best effort and the first push on a brand-new
      # repository still fails here — that is how this was discovered, and why the README says
      # so plainly. Once Pages is on, this step succeeds and every push deploys `dist/`.
      # Pages serves static files only — the signaling server is a separate Node process,
      # pointed at through VITE_SIGNALING_URL.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
